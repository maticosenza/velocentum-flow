<svg xmlns="http://www.w3.org/2000/svg" width="360" height="92" viewBox="0 0 360 92">
  <defs>
    <linearGradient id="cta-primary" x1="22" y1="16" x2="338" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6DA2"/>
      <stop offset="0.48" stop-color="#FF4B8D"/>
      <stop offset="1" stop-color="#E72F73"/>
    </linearGradient>
    <linearGradient id="cta-shine" x1="42" y1="18" x2="155" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
