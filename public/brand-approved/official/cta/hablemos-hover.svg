      <stop stop-color="#FF7CB0"/>
      <stop offset="0.46" stop-color="#FF4B8D"/>
      <stop offset="1" stop-color="#DC2468"/>
    </linearGradient>
    <linearGradient id="cta-hover-shine" x1="36" y1="18" x2="150" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.3"/>
